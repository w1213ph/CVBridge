name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build package
        shell: powershell
        run: .\scripts\package.ps1

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CVBridge-release
          path: CVBridge-release.zip
